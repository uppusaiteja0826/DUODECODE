
{% extends "base.html" %}

{% block title %}Reset Password - DUODECODE{% endblock %}

{% block head %}
<style>
    .auth-container {
        max-width: 430px;
        margin: 40px auto;
        background: white;
        padding: 35px;
        border-radius: 14px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .auth-container h1 {
        text-align: center;
        color: #172554;
        margin-bottom: 12px;
    }

    .subtitle {
        text-align: center;
        color: #64748b;
        margin-bottom: 25px;
        line-height: 1.6;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
    }

    .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
    }

    .reset-btn {
        width: 100%;
        padding: 13px;
        background: #1d4ed8;
        color: white;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        font-weight: bold;
    }

    .reset-btn:hover {
        background: #1e40af;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">

    <h1>Reset Password</h1>

    <p class="subtitle">
        Create a new password for your DUODECODE account.
    </p>

    <form method="POST" action="{{ url_for('reset_password') }}">

        <div class="form-group">
            <label for="password">New Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter new password"
                minlength="8"
                required
            >
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Re-enter new password"
                minlength="8"
                required
            >
        </div>

        <button type="submit" class="reset-btn">
            Update Password
        </button>

    </form>

</div>
{% endblock %}
