
{% extends "base.html" %}

{% block title %}Forgot Password - DUODECODE{% endblock %}

{% block head %}
<style>
    .auth-container {
        max-width: 430px;
        margin: 40px auto;
        background: white;
        padding: 35px;
        border-radius: 14px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .auth-container h1 {
        text-align: center;
        color: #172554;
        margin-bottom: 12px;
    }

    .subtitle {
        text-align: center;
        color: #64748b;
        margin-bottom: 25px;
        line-height: 1.6;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
    }

    .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
    }

    .submit-btn {
        width: 100%;
        padding: 13px;
        background: #1d4ed8;
        color: white;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        font-weight: bold;
    }

    .submit-btn:hover {
        background: #1e40af;
    }

    .extra-links {
        text-align: center;
        margin-top: 20px;
    }

    .extra-links a {
        color: #1d4ed8;
        text-decoration: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">

    <h1>Forgot Password?</h1>

    <p class="subtitle">
        Enter your registered email address.
        We will send you an OTP to reset your password.
    </p>

    <form method="POST" action="{{ url_for('forgot_password') }}">

        <div class="form-group">
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                required
            >
        </div>

        <button type="submit" class="submit-btn">
            Send OTP
        </button>

    </form>

    <div class="extra-links">
        <a href="{{ url_for('login') }}">Back to Login</a>
    </div>

</div>
{% endblock %}
