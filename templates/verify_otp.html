
{% extends "base.html" %}

{% block title %}Verify OTP - DUODECODE{% endblock %}

{% block head %}
<style>
    .otp-container {
        max-width: 430px;
        margin: 40px auto;
        background: white;
        padding: 35px;
        border-radius: 14px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        text-align: center;
    }

    .otp-container h1 {
        color: #172554;
        margin-bottom: 12px;
    }

    .otp-container p {
        color: #64748b;
        margin-bottom: 25px;
        line-height: 1.6;
    }

    .otp-input {
        width: 100%;
        padding: 14px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        text-align: center;
        font-size: 22px;
        letter-spacing: 8px;
        margin-bottom: 20px;
    }

    .verify-btn {
        width: 100%;
        padding: 13px;
        background: #1d4ed8;
        color: white;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        font-weight: bold;
    }
</style>
{% endblock %}

{% block content %}
<div class="otp-container">

    <h1>Verify Your OTP</h1>

    <p>
        Enter the 6-digit code sent to your registered email address.
    </p>

    <form method="POST"
    action="{% if session.get('pending_email') %}{{ url_for('verify_email') }}{% elif session.get('pending_login') %}{{ url_for('verify_login') }}{% else %}{{ url_for('verify_reset') }}{% endif %}">

        <input
            type="text"
            name="otp"
            class="otp-input"
            placeholder="000000"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            minlength="6"
            required
            autocomplete="one-time-code"
        >

        <button type="submit" class="verify-btn">
            Verify OTP
        </button>

    </form>

    <p style="margin-top:20px; font-size:13px;">
        Your OTP is valid for 5 minutes.
    </p>

</div>
{% endblock %}
