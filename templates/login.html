
{% extends "base.html" %}

{% block title %}Login - DUODECODE{% endblock %}

{% block head %}
<style>
    .auth-container {
        max-width: 430px;
        margin: 30px auto;
        background: white;
        padding: 35px;
        border-radius: 14px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .auth-container h1 {
        text-align: center;
        color: #172554;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #64748b;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
    }

    .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
    }

    .login-btn {
        width: 100%;
        padding: 13px;
        background: #1d4ed8;
        color: white;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        font-weight: bold;
    }

    .login-btn:hover {
        background: #1e40af;
    }

    .extra-links {
        text-align: center;
        margin-top: 20px;
        line-height: 2;
    }

    .extra-links a {
        color: #1d4ed8;
        text-decoration: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">

    <h1>Welcome Back!</h1>
    <p class="subtitle">Login to your DUODECODE account</p>

    <form method="POST" action="{{ url_for('login') }}">

        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <div class="extra-links">
        <p><a href="{{ url_for('forgot_password') }}">Forgot Password?</a></p>
        <p>Don't have an account?
            <a href="{{ url_for('register') }}">Sign Up</a>
        </p>
    </div>

</div>
{% endblock %}
